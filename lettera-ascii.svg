<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <style>
      .o{
        fill:none;
        stroke:#000;
        stroke-width:2.5;
        stroke-linecap:round;
        stroke-linejoin:round;
      }

      .b{fill:#000;}

      .txt{
        font-family:monospace;
        font-weight:bold;
        font-size:5px;
      }
    </style>
  </defs>

  <!-- ===== Papel ===== -->

  <rect x="18" y="5" width="28" height="18" rx="1.5" class="o"></rect>

  <!-- esquina doblada -->
  <polyline class="o" points="42,5 46,9 46,23"></polyline>

  <!-- Prompt -->
  <path class="o" d="M22 11
           L26 14
           L22 17"></path>

  <line class="o" x1="28" y1="17" x2="33" y2="17"></line>

  <!-- ===== Máquina ===== -->

  <!-- cuerpo -->

  <path class="o" d="
        M14 24
        H50
        L53 30
        V44
        H11
        V30
        Z"></path>

  <!-- rodillo -->
  <line class="o" x1="17" y1="24" x2="47" y2="24"></line>

  <!-- mandos -->

  <circle cx="10" cy="28" r="1.4" class="b"></circle>
  <circle cx="54" cy="28" r="1.4" class="b"></circle>

  <!-- teclado -->

  <g class="b">

    <circle cx="18" cy="32" r="1.3"></circle>
    <circle cx="23" cy="32" r="1.3"></circle>
    <circle cx="28" cy="32" r="1.3"></circle>
    <circle cx="33" cy="32" r="1.3"></circle>
    <circle cx="38" cy="32" r="1.3"></circle>
    <circle cx="43" cy="32" r="1.3"></circle>

    <circle cx="20.5" cy="37" r="1.3"></circle>
    <circle cx="25.5" cy="37" r="1.3"></circle>
    <circle cx="30.5" cy="37" r="1.3"></circle>
    <circle cx="35.5" cy="37" r="1.3"></circle>
    <circle cx="40.5" cy="37" r="1.3"></circle>

  </g>

  <!-- barra espaciadora -->

  <rect x="23" y="41" width="18" height="2.5" rx="1.2" class="b"></rect>

  <!-- ===== Candado ===== -->

  <g transform="translate(43 40)">

      <rect x="0" y="6" width="14" height="14" rx="2" class="o"></rect>

      <path class="o" d="
            M3 6
            V3
            a4 4 0 0 1 8 0
            v3"></path>

      <text class="txt" x="2.1" y="14">GPG</text>

  </g>

</svg>